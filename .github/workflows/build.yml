name: Build Linh Huong Office (Mac, Windows, Linux)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build Tauri Apps
        run: pnpm tauri:build
      - name: Zip Mac Apps
        run: |
          cd target/release/bundle/macos
          for app in *.app; do
            # Replace spaces with hyphens in the filename to avoid URL issues
            safe_name=$(echo "$app" | sed 's/ /-/g')
            mv "$app" "$safe_name"
            zip -r "${safe_name}.zip" "$safe_name"
          done
      - name: Upload Mac Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Apps
          path: target/release/bundle/macos/*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build Tauri Apps
        run: pnpm tauri:build
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Exe
          path: target/release/bundle/msi/*.msi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Build Tauri Apps
        run: pnpm tauri:build
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Deb
          path: target/release/bundle/deb/*.deb

  release:
    needs: [build-mac, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Linh Hương Office Latest Release
          draft: false
          prerelease: false
          make_latest: true
          files: |
            artifacts/macOS-Apps/*
            artifacts/Windows-Exe/*
            artifacts/Linux-Deb/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
